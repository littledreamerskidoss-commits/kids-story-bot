name: 100-Day Automated Daily Content Pipeline

on:
  schedule:
    - cron: '0 0 * * *' # Automatically runs once every single day at midnight UTC
  workflow_dispatch:
    inputs:
      day_number:
        description: 'Specify Day Number (1 to 100)'
        required: true
        default: '1'
      story_lang:
        description: 'Language (en, hi, ta)'
        required: true
        default: 'en'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Generate 2 Long Videos and 5 Shorts per day automatically
        include:
          - type: "video"
            index: 1
          - type: "video"
            index: 2
          - type: "short"
            index: 1
          - type: "short"
            index: 2
          - type: "short"
            index: 3
          - type: "short"
            index: 4
          - type: "short"
            index: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow gtts edge-tts moviepy google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Calculate Current Day Number
        id: day_calc
        run: |
          if [ "${{ github.event.inputs.day_number }}" != "" ]; then
            echo "DAY_NUM=${{ github.event.inputs.day_number }}" >> $GITHUB_ENV
          else
            # Automatically increments day number from 1 to 100
            DAY=$(( ( $(date +%j) % 100 ) + 1 ))
            echo "DAY_NUM=$DAY" >> $GITHUB_ENV
          fi

      - name: Generate Video / Short
        env:
          DAY_NUMBER: ${{ env.DAY_NUM }}
          CONTENT_TYPE: ${{ matrix.type }}
          CONTENT_INDEX: ${{ matrix.index }}
          STORY_LANG: ${{ github.event.inputs.story_lang || 'en' }}
        run: |
          python main_pipeline.py

      - name: Upload to YouTube
        env:
          DAY_NUMBER: ${{ env.DAY_NUM }}
          CONTENT_TYPE: ${{ matrix.type }}
          CONTENT_INDEX: ${{ matrix.index }}
          STORY_LANG: ${{ github.event.inputs.story_lang || 'en' }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_to_youtube.py
